# Publishes site/ -- the findings as a book you can walk through -- to GitHub
# Pages. site/ is plain files written by the main repo's
# scripts/library/export.py from exactly what this repo publishes, so this job
# builds nothing: it uploads the folder as it is.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
